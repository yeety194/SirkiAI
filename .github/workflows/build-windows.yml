name: Build Sirki.exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # Cheap canary — proves Actions can schedule anything at all.
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Canary
        run: echo "Sirki Actions canary OK"

  windows-exe:
    needs: canary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Sirki.exe
        run: python -m PyInstaller --noconfirm --clean packaging/sirkiai.spec

      - name: Stage release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\Sirki.exe release\Sirki.exe
          Copy-Item .env.example release\.env
          Copy-Item scripts\start_local_brain.ps1 release\start_local_brain.ps1
          Copy-Item docs\local-brain.md release\README-local-brain.md
          Set-Content -Path release\HOW_TO_RUN.txt -Value "1) Run start_local_brain.ps1  2) Launch Sirki.exe"

      - name: Upload Sirki.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sirki-windows
          path: release/
          if-no-files-found: error
